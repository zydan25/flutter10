<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق شبيك باي - سداد الفواتير وباقات الاتصالات">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="شبيك باي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>شبيك باي | Shopik Pay</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0f172a;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #8B1D3B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-weight: bold; font-size: 16px;">جاري تشغيل تطبيق شبيك فلاتر...</div>
  </div>

  <script>
    function hideLoading() {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoading);

    var observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, canvas')) {
        hideLoading();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    setTimeout(hideLoading, 5000);

    // Dynamically inject flutter_bootstrap.js
    var flutterScript = document.createElement('script');
    flutterScript.src = 'flutter_bootstrap.js';
    flutterScript.async = true;
    document.body.appendChild(flutterScript);
  </script>
</body>
</html>
